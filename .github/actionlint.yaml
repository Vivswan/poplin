# Repo-owned actionlint configuration. Written once by
# Vivswan/repo-platform, never overwritten by a later sync,
# so add this repository's own ignores freely.

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint's permission-scope list lacks `vulnerability-alerts` (rhysd/actionlint#666); drop when it knows the scope.
      - 'unknown permission scope "vulnerability-alerts"'
      # actionlint's syntax check lacks the `queue` key of `concurrency` (rhysd/actionlint#654); drop when it knows the key.
      - 'unexpected key "queue" for "concurrency" section'

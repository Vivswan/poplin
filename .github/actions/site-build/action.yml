# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync.

name: Site Build
description: |
  Builds this repository's own website for the fleet's Pages deploy.

  It runs as the site-build hook of ci.yml's `site` leg, on the judged commit, before the fleet
  renders docs/ and deploys.

  Before the build it asks GitHub which releases carry the release workflow's attestation, and the build
  publishes those, each with the digest of its files, as `releases.json`.

  The build reads `DEMO_URL` from the deploy job's environment: `site.vars` in .repo-platform.yml
  names the repository variable the fleet exports there.

  The contract and examples are the fleet's docs/modules/site.md.

inputs:
  base-path:
    description: The URL path the site is served under, "/<repo>/", or "/" for the owner's <owner>.github.io repository
    required: true
  origin:
    description: The site's origin, https://<owner>.github.io
    required: true

outputs:
  dist:
    description: The built site's directory, relative to the repository root, or empty for no repository site
    value: ${{ steps.build.outputs.dist }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    # Which releases an install may take, each with the digest of its files: only an archive the release workflow attested in a run of main.
    - name: Name the releases whose files are attested
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bun run --cwd packages/cloudflare pin-releases "$RUNNER_TEMP/release-pins.json"
    - id: build
      shell: bash
      env:
        PAGES_BASE_PATH: ${{ inputs.base-path }}
        PAGES_ORIGIN: ${{ inputs.origin }}
        POPLIN_RELEASE_PINS: ${{ runner.temp }}/release-pins.json
      run: |
        bun run --cwd website build
        echo "dist=website/dist" >> "$GITHUB_OUTPUT"

---
# This repository's OWN settings overlay, written once and repo-owned: edit this file, never the rendered .github/settings.yml (the next sync replaces it and holds the PR).
# Fleet defaults merge UNDER it and the fleet invariants (squash-only merging, the protection rulesets) ABOVE it (Vivswan/repo-platform's docs/settings.md).
#
#   a key declared here   -> wins over the fleet default
#   labels (a list)       -> merge into the fleet entry by name; undeclared labels are deleted by the apply
#   rulesets (a list)     -> merge into the fleet entry by name; undeclared rulesets are deleted by the apply
#   _remove: true         -> on an entry named like a fleet one, drops the fleet's entry

repository:
  description: "Agents publish static sites to your own Cloudflare account: private by default, shareable by secret link, or public."
  # Declared even when empty: the apply manages only declared keys, so
  # this keeps topics healing out-of-band edits.
  topics:
    - cloudflare-workers
    - cloudflare-r2
    - cloudflare-access
    - static-site
    - static-hosting
    - mcp
    - mcp-server
    - ai-agents
    - cli
    - typescript
  private: false

# This repository's own labels (the fleet layers already carry the
# dependabot, release, and tracking labels its modules need).
# The nightly live checks find their open issue by its label, so each label is declared here to outlive the apply.
# The name, colour, and description are the ones live-checks.yml and live-checks-account-address.yml pass.
labels:
  - name: live-nightly-domain
    color: "D93F0B"
    description: The nightly live checks of the test install (domain) ended red
  - name: live-nightly-account-address
    color: "D93F0B"
    description: The nightly live checks of the test install (account address) ended red

# This repository's own rulesets, or additions to a fleet one (an entry
# named like a fleet ruleset merges into it and adds its rules):
# rulesets:
#   - name: my-ruleset
#     target: branch
#     enforcement: active

# The environments for the tests that run against a real Cloudflare account: only a job that names one can read its secrets, in a run of main or
# of a pull request from a branch of this repository. GitHub judges a run by its ref, which is `refs/pull/<number>/merge` for every pull request,
# so no rule can name the release's branch alone; the job that upgrades a test install stands down outside the pull request of a release (live-upgrade.yml).
# A pull request from a fork reads no secret.
# Each of the two test accounts has its own, and the secrets carry the same names in both.
# The secrets are set on GitHub, never declared here: an absent `secrets` key leaves live secrets untouched.
environments:
  - name: with-domain-ci-tests
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    deployment_branch_policies:
      - name: main
      - name: refs/pull/*/merge
    # Declared off, not omitted: a reviewer rule or a wait timer added by hand would park every run, and only a declared value heals it.
    reviewers: []
    wait_timer: 0
    prevent_self_review: false
  - name: without-domain-ci-tests
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    deployment_branch_policies:
      - name: main
      - name: refs/pull/*/merge
    # Declared off, not omitted: a reviewer rule or a wait timer added by hand would park every run, and only a declared value heals it.
    reviewers: []
    wait_timer: 0
    prevent_self_review: false

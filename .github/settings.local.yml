---
# This repository's OWN settings overlay, written once and repo-owned: edit this file, never the rendered .github/settings.yml (the next sync replaces it and holds the PR).
# Fleet defaults merge UNDER it and the fleet invariants (squash-only merging, the protection rulesets) ABOVE it (Vivswan/repo-platform's docs/settings.md).
#
#   a key declared here   -> wins over the fleet default
#   labels (a list)       -> merge into the fleet entry by name; undeclared labels are deleted by the apply
#   rulesets (a list)     -> merge into the fleet entry by name; undeclared rulesets are deleted by the apply
#   _remove: true         -> on an entry named like a fleet one, drops the fleet's entry

repository:
  description: "Agents publish static sites to your own Cloudflare account: private by default, shareable by secret link, or public."
  # Declared even when empty: the apply manages only declared keys, so
  # this keeps topics healing out-of-band edits.
  topics:
    - cloudflare-workers
    - cloudflare-r2
    - cloudflare-access
    - static-site
    - static-hosting
    - mcp
    - mcp-server
    - ai-agents
    - cli
    - typescript
  private: false

# This repository's own labels (the fleet layers already carry the
# dependabot, release, and tracking labels its modules need):
# labels:
#   - name: my-label
#     color: "0e8a16"
#     description: What it marks

# This repository's own rulesets, or additions to a fleet one (an entry
# named like a fleet ruleset merges into it and adds its rules):
# rulesets:
#   - name: my-ruleset
#     target: branch
#     enforcement: active

# The real-zone tests' environment: only a job in a main run that names it can read its secret, and GitHub itself holds the rule.
# The secret is set on GitHub, never declared here: an absent `secrets` key leaves live secrets untouched.
environments:
  - name: bench
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    deployment_branch_policies:
      - name: main
    # Declared off, not omitted: a reviewer rule or a wait timer added by hand would park every run, and only a declared value heals it.
    reviewers: []
    wait_timer: 0
    prevent_self_review: false

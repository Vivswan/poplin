# Checks a real install on the Cloudflare test account after a push to main that changed a file reaching it, and on a manual run.
# Puts it back to the sample sites after each run of the checks, and at midnight UTC.
#
#   a push that changed a file of the `paths` list -> wait for that commit's `all-green` check -> build the Worker bundle
#     -> make the standing test install match the commit -> run tests/live against it -> put the install back
#   a push that changed no such file -> GitHub starts no run
#   a run by hand with `start_over` ticked -> everything poplin made on the test account removed -> the same steps, from nothing
#
#   put back: every site that is no sample and not the demo removed, each sample that differs from demo/samples and its table published anew, the demo published when its files differ, waiting logins and every token removed
#
# The test install stays up between runs, with its logins and its settings.
# The environment's secrets reach the steps that call Cloudflare and no other step. Each step prints what it did.
# A piece the install answers without, lacking a token permission or an account switch only a person can flip, is a
# warning and a skipped row of the step summary, with what it needs. Anything else that stops a step fails the run.
#
# It is its own workflow, not a job of post-green.yml: the release leg waits on that hook, and a path filter belongs to a push.

name: Live Checks

on:
  # A push to this repository's main. A pull request and a fork's branch start nothing here.
  # A file in no line below starts a run: the list opens with every file, and each `!` line takes files out.
  push:
    branches: [main]
    paths:
      - "**"
      - "!website/**"
      - "!docs/**"
      - "!brand/**"
      - "!skills/**"
      - "!*.md"
      - "!.github/**"
      - ".github/workflows/live-checks.yml"
      - ".github/actions/setup/**"
      - "!tests/*.test.ts"
      - "!tests/fuzz/**"
      - "!tests/support/**"
      - "!.editorconfig"
      - "!.gitignore"
      - "!.gitleaks.toml"
      - "!.repo-platform.yml"
      - "!.typography-allow"
      - "!.yamllint"
      - "!biome.json"
      - "!biome.local.jsonc"
      - "!knip.json"
      - "!lefthook.yml"
      - "!.release-please-manifest.json"
      - "!release-please-config.json"
  # Midnight UTC. A schedule runs the default branch's own file and nothing a pull request or a fork wrote; a fork's
  # schedule has none of this repository's secrets.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      many_files:
        description: Also publish two thousand small files (thousands of requests on the test account)
        type: boolean
        default: false
      start_over:
        description: First remove everything poplin made on the test account, then make the install from nothing
        type: boolean
        default: false

permissions:
  contents: read

# One waiting run for each event: a newer push takes the place of an older push that waits, and never of the midnight run.
concurrency:
  group: live-checks-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  live:
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment: with-domain-ci-tests
    # The wait reads the commit's run of CI and the jobs of that run.
    permissions:
      contents: read
      actions: read
    # One lane for every job that touches the install. `queue: max` keeps each waiting job: none takes another's place.
    concurrency:
      group: live-checks
      cancel-in-progress: false
      queue: max
    steps:
      # The commit of the push, the one whose gate the next step waits for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The gate is the `all-green` job of the commit's own CI run, the one a push to main started. A job after the gate stops nothing here.
      # The step's own timeout is above the script's ceiling of 30 minutes, so the wait ends with its own line.
      - name: Wait for this commit's all-green check
        if: github.event_name == 'push'
        timeout-minutes: 32
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun packages/cloudflare/scripts/live/gate.ts
      - name: Build the Worker bundle
        run: bun run --cwd packages/cloudflare build
      # Only a run started by hand with the box ticked: a push and the midnight run have no such input.
      - name: Start the test install over
        if: inputs.start_over
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POPLIN_LIVE_START_OVER: ${{ inputs.start_over }}
        run: bun run --silent --cwd packages/cloudflare live:start-over
      - name: Make the test install match the commit
        id: converge
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}
        run: bun run --silent --cwd packages/cloudflare live:converge
      - name: Run the live checks
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}
          POPLIN_LIVE_MANY_FILES: ${{ inputs.many_files && '1' || '0' }}
          MISSING: ${{ steps.converge.outputs.missing }}
        run: bun run --silent --cwd packages/cloudflare live:suite "$MISSING"
      # Whatever the checks came to, so the owner finds the samples and the demo. It removes every token, and with them
      # the row of a suite step that was killed before it could remove its own.
      - name: Put the test install back
        if: always() && steps.converge.outcome == 'success'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --silent --cwd packages/cloudflare live:reset

  # The midnight run. It shares the lane of the checks, so it never touches the install while they do. On an account
  # that holds no test install it says so and ends green.
  reset:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: with-domain-ci-tests
    concurrency:
      group: live-checks
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Put the test install back
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --silent --cwd packages/cloudflare live:reset

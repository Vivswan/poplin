# Checks the real install on the Cloudflare test account that holds a domain: an install whose every site is a hostname under it, at midnight UTC and on a manual run.
# Puts it back to the sample sites after each run of the checks, and at midnight UTC. live-checks-account-address.yml does the same for the account that holds none.
#
#   midnight UTC, or a run by hand -> the steps of live-install.yml on the `with-domain-ci-tests` account, for main as it is
#   a push to main                 -> GitHub starts no run here
#   a midnight run that ended red  -> one open issue for this kind of install, which the next green midnight run closes
#
# The steps and the reset are in live-install.yml, written once for both kinds. release-live-upgrade.yml runs the same steps on the pull request of a release.

name: Live Checks

on:
  # Midnight UTC. A schedule runs the default branch's own file and nothing a pull request or a fork wrote; a fork's
  # schedule has none of this repository's secrets.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      many_files:
        description: Also publish two thousand small files (thousands of requests on the test account)
        type: boolean
        default: false
      start_over:
        description: First remove the test install with poplin uninstall, then make it from nothing with poplin install
        type: boolean
        default: false
      upgrade:
        description: First upgrade from the last release, then from the newest earlier pre-release as advice (each removes the test install and writes about 230 database rows)
        type: boolean
        default: false
      load:
        description: Also run the small load after the checks (at most 600 rows written and 80 bucket writes and lists on the test account)
        type: boolean
        default: false

permissions:
  contents: read

# One waiting run of this workflow for each event: a newer run by hand takes the place of an older one that waits, and never of the midnight run.
concurrency:
  group: live-checks-domain-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Only a run by hand with the box ticked. release-live-upgrade.yml calls the same file, for the pull request of a release.
  # From the last release first: its failure fails the run.
  upgrade:
    name: live (domain)
    if: inputs.upgrade == true
    uses: ./.github/workflows/live-upgrade.yml
    with:
      kind: domain
      from: release
      environment: with-domain-ci-tests
    # Only the names the steps read. The called job names the environment, and its secret of a name is the one it reads, not a value handed over here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # Then from the newest pre-release that is an earlier build, in the same lane: its failure is a warning.
  upgrade-next:
    name: live (domain)
    needs: [upgrade]
    if: ${{ !cancelled() && inputs.upgrade == true }}
    uses: ./.github/workflows/live-upgrade.yml
    with:
      kind: domain
      from: next
      environment: with-domain-ci-tests
    # Only the names the steps read. The called job names the environment, and its secret of a name is the one it reads, not a value handed over here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # After the upgrades where they were asked for, whatever they came to.
  live:
    name: live (domain)
    needs: [upgrade, upgrade-next]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/live-install.yml
    with:
      kind: domain
      environment: with-domain-ci-tests
      many_files: ${{ inputs.many_files == true }}
      start_over: ${{ inputs.start_over == true }}
      load: ${{ inputs.load == true }}
    # Only the names the steps read. The called jobs name the environment, and its secret of a name is the one they read, not a value handed over here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # A red midnight run is one open issue of this kind's label, refreshed each red night; a green one closes it. A run by hand files and closes nothing.
  # A cancelled run counts as red: a job that reached its timeout is cancelled, not failed.
  report:
    name: report (domain)
    needs: [live]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action writes the issue, and assigns it itself: an issue it creates starts no workflow.
    permissions:
      issues: write
    steps:
      - name: File or refresh the issue of a red night
        if: needs.live.result == 'failure' || needs.live.result == 'cancelled'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "live-nightly-domain"
          title: Nightly live checks failed (domain)
          label-color: "D93F0B"
          label-description: "The nightly live checks of the test install (domain) ended red"
          stream: generic

      - name: Close the issue on a green night
        if: needs.live.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "live-nightly-domain"
          stream: generic

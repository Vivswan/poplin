# Checks a real install on the Cloudflare test account after a green main that changed a file reaching it, and on a manual run.
# Puts it back to the sample sites after each run of the checks, and at midnight UTC.
#
#   decide: did a commit since the last green deploy change a file that reaches the install?
#     run   build the Worker bundle -> make the standing test install match main -> run tests/live against it -> put the install back
#     skip  a notice and a line of the step summary, green, with no call to Cloudflare
#
#   put back: every site but the demo removed, the trash emptied, the samples of demo/samples and the demo published, waiting logins and every token removed
#
# The test install stays up between runs, with its logins and its settings.
# The environment's secrets reach the steps that call Cloudflare and no other step. Each step prints what it did.
# A piece the install answers without, lacking a token permission or an account switch only a person can flip, is a
# warning and a skipped row of the step summary, with what it needs. Anything else that stops a step fails the run.
#
# It is its own workflow, not a job of post-green.yml: one lane holds every run so two never touch the install together,
# and a lane shared across commits would cancel the hook the release leg waits on.

name: Live Checks

on:
  # A run of CI on this repository's main that ended green. The job's condition holds the line: a pull request's run,
  # or a run from a fork, never gets past it, and the code checked out is this repository's main. Neither does the run
  # of a commit that main has moved past: the newest commit's own run checks the same install.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Midnight UTC. A schedule runs the default branch's own file and nothing a pull request or a fork wrote; a fork's
  # schedule has none of this repository's secrets.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      many_files:
        description: Also publish two thousand small files (thousands of requests on the test account)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: cloudflare-live-tests
    # The decision reads the earlier runs of this workflow and their steps.
    permissions:
      contents: read
      actions: read
    # One lane: a run waits for the one before it, and a newer waiting run replaces an older one.
    concurrency:
      group: live-checks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Every commit of main: the decision lists the files changed since an earlier one.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Only the verdict `skip` holds the steps below back. A decision that fails stops the job red.
      - name: Decide whether this commit reaches the test install
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun packages/cloudflare/scripts/live/decide.ts
      - name: Build the Worker bundle
        if: steps.decide.outputs.verdict != 'skip'
        run: bun run --cwd packages/cloudflare build
      - name: Make the test install match main
        id: converge
        if: steps.decide.outputs.verdict != 'skip'
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}
        run: bun run --silent --cwd packages/cloudflare live:converge
      - name: Run the live checks
        if: steps.decide.outputs.verdict != 'skip'
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}
          POPLIN_LIVE_MANY_FILES: ${{ inputs.many_files && '1' || '0' }}
          MISSING: ${{ steps.converge.outputs.missing }}
        run: bun run --silent --cwd packages/cloudflare live:suite "$MISSING"
      # Whatever the checks came to, so the owner finds the samples and the demo. It removes every token, and with them
      # the row of a suite step that was killed before it could remove its own.
      - name: Put the test install back
        if: always() && steps.converge.outcome == 'success'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --silent --cwd packages/cloudflare live:reset

  # Before the midnight reset: wait until no other run of this workflow is queued or running. The lane holds one waiting
  # job, and a job that joins it takes that one's place, so a reset that joined while the checks waited would cancel them.
  # This job is in no lane, so its own wait cancels nothing. A lane busy for an hour ends the run red, with no reset.
  lane:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Wait until no other run is queued or running
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun packages/cloudflare/scripts/live/lane.ts

  # The midnight run. It shares the lane of the checks, so it never touches the install while they do. On an account
  # that holds no test install it says so and ends green.
  reset:
    needs: lane
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-live-tests
    concurrency:
      group: live-checks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Put the test install back
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --silent --cwd packages/cloudflare live:reset

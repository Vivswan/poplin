# Runs the nightly CI, as the starter written once by Vivswan/repo-platform and never overwritten by a
# later sync.
#
# The report job files one label-deduplicated tracking issue on a red
# night and closes it on a green one (docs/modules/nightly.md).
#
#   the website's releases.json and latest.json name the newest tag of this repository   -> green
#   a file cannot be fetched, is not one an install can read, or names another release   -> red, one sentence a fault
#
# The release gate is not called here: at night it would run only the upgrade on the local fake, which every push runs.
name: Nightly

on:
  schedule:
    # Pick your own minute so the fleet's nightlies do not all land at
    # once.
    - cron: "59 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag: the newest one is what the website is compared with.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Add sibling jobs freely: list each in the report job's `needs` and
      # fold its result into the red/green conditions there.

      # Every install asks the website once a day which release is the newest, and takes a release only by the digest the website names.
      - name: Read whether the website names the newest release
        run: bun packages/providers/cloudflare/scripts/live/feed-watch.ts

  # A CANCELLED job counts as red: hitting the timeout cancels rather
  # than fails, and a hang is exactly what a nightly exists to catch.
  report:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    # A hung reporter is the residual silence window; keep this tight.
    timeout-minutes: 5
    # issues: write is for the fuzz-issue action; an issue it creates fires no issues:opened event, so it assigns the owner itself.
    permissions:
      issues: write
    steps:
      - name: File or update the nightly issue
        if: contains(fromJSON('["failure","cancelled"]'), needs.checks.result)
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "nightly-failure"
          title: Nightly CI failures
          label-color: "D93F0B"
          label-description: "Automated nightly CI failure"
          stream: generic

      - name: Close the nightly issue on a green night
        if: needs.checks.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "nightly-failure"
          stream: generic

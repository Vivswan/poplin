# Runs the nightly fuzzing, as the starter written once by Vivswan/repo-platform and never overwritten
# by a later sync.
#
# The fuzz job runs every target under tests/fuzz side by side, three minutes each (fuzz.yml). Each failing property
# writes its report, with the seed and the replay command, where the failure-report contract in docs/modules/fuzzer.md wants it.
name: Nightly Fuzz

on:
  schedule:
    # Pick your repo's own minute so the fleet's nightlies do not all
    # land on GitHub at once.
    - cron: "11 9 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz seed (blank for a random one)
        required: false
        default: ""
      iterations:
        description: Fuzz iterations
        required: false
        default: "1000"

concurrency:
  group: nightly-fuzz

permissions:
  contents: read

jobs:
  # The run itself is fuzz.yml, the one the checks of a pull request and the release gate call too. A blank seed
  # (the nightly) draws a new one; a blank `iterations` (the nightly) leaves the time as the only limit.
  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      seed: ${{ inputs.seed }}
      iterations: ${{ inputs.iterations }}

  # A CANCELLED fuzz job counts as red: hitting the timeout cancels rather
  # than fails, and a hang is exactly what a fuzzer exists to find.
  report:
    needs: [fuzz]
    if: always()
    runs-on: ubuntu-latest
    # A hung reporter is the residual silence window; keep this tight.
    timeout-minutes: 5
    # issues: write is for the fuzz-issue action; an issue it creates fires no issues:opened event, so it assigns the owner itself.
    permissions:
      issues: write
    steps:
      # A pattern download of nothing succeeds, so a night that wrote no
      # artifact still files the bare notice.
      - name: Download the failure artifacts
        if: needs.fuzz.result == 'failure' || needs.fuzz.result == 'cancelled'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-failures-*
          path: .fuzz-failures
          merge-multiple: true

      # always(): a bare condition implies success() over the steps before it, so a download that failed
      # (an API error on a red night) would skip the filing and the night would go silent.
      - name: File or update the fuzz issue
        if: always() && (needs.fuzz.result == 'failure' || needs.fuzz.result == 'cancelled')
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "fuzz-nightly"
          title: Nightly fuzz failures
          artifacts-dir: .fuzz-failures
          artifact-name: fuzz-failures-*
          label-color: "B60205"
          label-description: "Automated nightly fuzz failure"
          stream: fuzz

      - name: Close the fuzz issue on a green night
        if: needs.fuzz.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "fuzz-nightly"
          stream: fuzz

# The steps of the live checks, for the one test install a caller names. Each of the two callers of a night is a workflow of one kind of install:
#
#   live-checks.yml                    kind `domain`             environment with-domain-ci-tests
#   live-checks-account-address.yml    kind `account address`    environment without-domain-ci-tests
#
#   every run -> build the Worker bundle -> make the standing test install match main -> run packages/providers/cloudflare/live against it -> put the install back
#   a run by hand with `start_over` ticked -> the same steps, and the one that makes the install match first removes it with `poplin uninstall`, then makes it from nothing
#   a run by hand with `upgrade` ticked -> the caller first runs live-upgrade.yml: the older build installed with its own commands, filled, and updated to this commit's build; then these steps
#   the pull request of a release -> release-live-upgrade.yml calls these steps after its upgrades, whatever they came to: main checked out and built
#     -> the install made to match main, which starts it over where the upgrade left its later schema step -> the same checks -> put back
#
#   make the install match: `poplin install` where the account holds none, and where it holds one the commit's build by the upload of an update, then `poplin doctor --repair`
#   midnight UTC -> the same steps for main as it is, with one check more: a copy too large for one request, which the install's job finishes
#
#   put back: every site that is no sample and not the demo removed, each sample that differs from demo/samples and its table published anew, the demo published when its files differ, waiting logins and every token removed
#
# The test install stays up between runs, with its logins and its settings.
# Each job names the environment, so the environment's secrets are the ones its steps read, under the names declared below.
# They reach the steps that call Cloudflare and no other step. Each step prints what it did.
# A piece the install answers without, lacking a token permission or an account switch only a person can flip, is a
# warning and a skipped row of the step summary, with what it needs. Anything else that stops a step fails the run.

name: Live Install

on:
  workflow_call:
    inputs:
      kind:
        description: "The kind of install the account holds: `domain` or `account address`"
        type: string
        required: true
      environment:
        description: The environment that holds the test account's secrets
        type: string
        required: true
      many_files:
        description: Also publish two thousand small files
        type: boolean
        default: false
      start_over:
        description: First remove the test install from its account
        type: boolean
        default: false
      load:
        description: Also run the small load after the checks
        type: boolean
        default: false
    # The names the steps read. A caller must hand each name over, and the value may be empty: the one a step reads is the secret of the job's environment.
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: The token of the test account
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: The test account
        required: true
      POPLIN_LIVE_LOGIN:
        description: The email the test install lets in
        required: true

permissions:
  contents: read

jobs:
  # A caller runs these after the upgrade where one was asked for, whatever it came to: they put the install back to the commit's own build and the samples.
  # The `if:` is the one every job that names a test account's environment carries (live-upgrade.yml says what it admits).
  checks:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.head_ref == 'release-please--branches--main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment: ${{ inputs.environment }}
    # Which kind of install the account holds: every script that calls Cloudflare reads it.
    env:
      POPLIN_LIVE_INSTALL: ${{ inputs.kind }}
    # One lane for every job that touches the test install of one kind: the two kinds are two accounts, and run side by side. `queue: max` keeps each waiting job: none takes another's place.
    concurrency:
      group: live-checks-${{ inputs.kind }}
      cancel-in-progress: false
      queue: max
    steps:
      # A pull request's run takes the branch it would merge into, so the install is the one main's own run makes. Any other run names no such branch, and takes its own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}
      - uses: ./.github/actions/setup
      # The same asking as the job's `if:`, read from the file of the event: it stops the job before any step is handed a secret.
      - name: Refuse a run that may not reach a test account
        run: bun packages/providers/cloudflare/scripts/admit.ts
      - name: Build the Worker bundle
        run: bun run --cwd packages/providers/cloudflare build
      # The box is ticked only on a run started by hand: the midnight run and the pull request of a release have no such input, and the step then removes nothing unless another build made the install.
      - name: Make the test install match the commit
        id: converge
        timeout-minutes: 22
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}
          POPLIN_LIVE_START_OVER: ${{ inputs.start_over }}
        run: bun run --silent --cwd packages/providers/cloudflare live:converge
      - name: Run the live checks
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}
          POPLIN_LIVE_MANY_FILES: ${{ inputs.many_files && '1' || '0' }}
          POPLIN_LIVE_LOAD: ${{ inputs.load && '1' || '0' }}
          MISSING: ${{ steps.converge.outputs.missing }}
        run: bun run --silent --cwd packages/providers/cloudflare live:suite "$MISSING"
      # Whatever the checks came to, so the owner finds the samples and the demo. It removes every token, and with them
      # the row of a suite step that was killed before it could remove its own.
      - name: Put the test install back
        if: always() && steps.converge.outcome == 'success'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --silent --cwd packages/providers/cloudflare live:reset

  # The midnight reset, beside the checks of that night. It shares their lane, so it never touches an install while they
  # do, and it puts an install back when they stopped before their own reset. On an account that holds no test install it
  # says so and ends green.
  reset:
    if: >-
      github.event_name == 'schedule' &&
      (github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.head_ref == 'release-please--branches--main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      POPLIN_LIVE_INSTALL: ${{ inputs.kind }}
    concurrency:
      group: live-checks-${{ inputs.kind }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same asking as the job's `if:`, read from the file of the event: it stops the job before any step is handed a secret.
      - name: Refuse a run that may not reach a test account
        run: bun packages/providers/cloudflare/scripts/admit.ts
      - name: Put the test install back
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --silent --cwd packages/providers/cloudflare live:reset

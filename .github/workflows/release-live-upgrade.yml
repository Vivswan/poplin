# The live tests of a release, on the two test installs: a real install of an older build, on each test account, takes the release
# as it would merge as an update and must answer as before (packages/providers/cloudflare/live/README.md, "The upgrade").
# Then the live checks of a night run on each install, which also puts it back: the upgrade removes the sample sites and the demo, and leaves a schema step main does not have.
#
#   the pull request of a release -> live-upgrade.yml from the last release, once for each kind of install: a failure fails the check
#                                 -> live-upgrade.yml from the newest earlier pre-release, after it in the same lane: a failure is a warning
#                                 -> live-install.yml, once, whatever the upgrades came to: main's build, the live checks, the sample sites, the demo: a failure fails the check
#   every other pull request      -> every job skips
#
# It is its own workflow, started by the event, and not a job of release-gate.yml: a called workflow is handed only the
# secrets its caller passes, and the caller of the release gate passes none, so a job under the gate reads an empty value.
# Each upgrade and each run of the checks waits in the lane of its kind's live checks (live-upgrade.yml, live-install.yml), and no newer run stops one that started.

name: Release Live Upgrade

on:
  pull_request:

permissions:
  contents: read

jobs:
  # The branch is the one release-please opens the release from. The called job asks the rest: this repository, and the
  # release bot as the one who opened it.
  domain:
    name: live upgrade from the last release (domain)
    if: github.head_ref == 'release-please--branches--main'
    uses: ./.github/workflows/live-upgrade.yml
    with:
      kind: domain
      from: release
      environment: with-domain-ci-tests
    # Only the names the steps read. The called job names the environment, and its secret of a name is the one it reads, not a value handed over here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # After the upgrade from the release, failed or not: the two share one install, so they never run side by side.
  domain-next:
    name: live upgrade from a pre-release, as advice (domain)
    needs: [domain]
    if: ${{ !cancelled() && github.head_ref == 'release-please--branches--main' }}
    uses: ./.github/workflows/live-upgrade.yml
    with:
      kind: domain
      from: next
      environment: with-domain-ci-tests
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  account-address:
    name: live upgrade from the last release (account address)
    if: github.head_ref == 'release-please--branches--main'
    uses: ./.github/workflows/live-upgrade.yml
    with:
      kind: account address
      from: release
      environment: without-domain-ci-tests
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # After the upgrade from the release, failed or not: the two share one install, so they never run side by side.
  account-address-next:
    name: live upgrade from a pre-release, as advice (account address)
    needs: [account-address]
    if: ${{ !cancelled() && github.head_ref == 'release-please--branches--main' }}
    uses: ./.github/workflows/live-upgrade.yml
    with:
      kind: account address
      from: next
      environment: without-domain-ci-tests
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # Once, after both upgrades, failed or not, and where neither found a build to start from: the checks of a release run all the same.
  # A run that was cancelled checks nothing and puts nothing back: the midnight run of main does.
  checks-domain:
    name: live checks (domain)
    needs: [domain, domain-next]
    if: ${{ !cancelled() && github.head_ref == 'release-please--branches--main' }}
    uses: ./.github/workflows/live-install.yml
    with:
      kind: domain
      environment: with-domain-ci-tests
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # Once, after both upgrades, failed or not, and where neither found a build to start from: the checks of a release run all the same.
  # A run that was cancelled checks nothing and puts nothing back: the midnight run of main does.
  checks-account-address:
    name: live checks (account address)
    needs: [account-address, account-address-next]
    if: ${{ !cancelled() && github.head_ref == 'release-please--branches--main' }}
    uses: ./.github/workflows/live-install.yml
    with:
      kind: account address
      environment: without-domain-ci-tests
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

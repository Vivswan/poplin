# Runs this repository's own checks under the all-green gate.
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync, so edit freely.
#
# The caller passes the repository's secrets through (a job reading an environment secret declares its environment) and
# caps at contents: read. A check needing more permissions gets its own workflow, wired via .github/settings.yml.
#
# A job skipped by its own `if:` stands down from the all-green gate. A job with `continue-on-error: true` is an
# advisory check, whose failures stay out of the gate too.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The upgrade tests read the last release from the tags, and its code and one older commit from the history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint (biome)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      # The fuzz targets run in the `fuzz` job.
      - name: Test
        run: bun run test --path-ignore-patterns 'tests/fuzz/**'
      - name: Test the dashboard's client
        run: bun run test:client
      - name: Build the Worker bundle and test the Worker (Workers runtime)
        run: bun run test:worker

  # The tests of `check` again, with the package told one minor version above its own, as a release tells it. A test
  # that states today's version passes on every other pull request and fails on the release's own.
  next-version:
    name: test / next version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The upgrade tests read the last release from the tags, and its code and one older commit from the history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Tell the package the next version
        working-directory: packages/cli
        run: bun pm version minor --no-git-tag-version
      - name: Test
        run: bun run test --path-ignore-patterns 'tests/fuzz/**'
      - name: Test the dashboard's client
        run: bun run test:client
      - name: Build the Worker bundle and test the Worker (Workers runtime)
        run: bun run test:worker

  # What each action asks of the database and the storage, held to the budget that keeps an install inside Cloudflare's
  # free plan (packages/providers/cloudflare/tests/shared/worker/request-budget.test.ts). A row over its budget fails the job.
  #
  #   every run        the job's summary: the standing, one row a ceiling, then every table; and the `free-plan-budget` artifact: every row as JSON
  #   a pull request   the summary and an annotation lead with what the change did to the costs, against the newest green run on main
  budget:
    name: free-plan budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Measure each action against its budget
        env:
          FREE_PLAN_BUDGET_FILE: ${{ runner.temp }}/free-plan-budget.json
        run: bun run --cwd packages/providers/cloudflare budget
      - name: Keep the numbers of this run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: free-plan-budget
          path: ${{ runner.temp }}/free-plan-budget.json
          if-no-files-found: error
      # The summary shows the row that went over, so it is written after a failed measuring step too.
      - name: Write the summary, against the newest green run on main for a pull request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FREE_PLAN_BUDGET_FILE: ${{ runner.temp }}/free-plan-budget.json
        run: bun run --cwd packages/providers/cloudflare budget:report

  # Every fuzz target side by side, three minutes each (fuzz.yml). The seed is the one input of that file: blank here,
  # as in the nightly and the release gate, so each run draws a new one and its job `plan` prints it.
  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      seed: ""

  # The product's tests and the three tree guards on every OS a user publishes from. The runtime is the bun that
  # .bun-version pins: the tests import bun:test, which no other runtime provides. The fuzz tests run in `fuzz` alone.
  # The Worker's tests run in `check` and `next-version` alone: they need the Workers runtime, and the root `test` script
  # this job calls leaves the Workers-runtime tests of `packages/providers/cloudflare` out.
  matrix:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test the packages and the tree guards
        run: bun run test ./packages/ ./tests/layout.test.ts ./tests/portable.test.ts ./tests/no-old-shapes.test.ts

  # Every link, heading anchor, and image of the repository's Markdown pages, as lychee.toml sets the check. No install:
  # the pages link nothing a build makes. The lychee is the one the site's own link check runs.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the links and images of every Markdown page
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: "'**/*.md'"
          # The check is offline, so the action gets no token to send.
          token: ""

  # The published package as a user gets it: packed, installed from the tarball with npm, and run under plain Node.
  # bun installs the workspace; the Node of the matrix runs the bundler, npm, and the installed package.
  package:
    name: package / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Pack, install, and run the package
        run: bun run --cwd packages/cli smoke

  # The website: its TypeScript checked, and every page built under the address the Pages deploy serves it from. The
  # build is what proves the pages render; the environment is the one .github/actions/site-build sets.
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bunx tsc -p website
      - name: Build
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
          DEMO_URL_NO_DOMAIN: ${{ vars.DEMO_URL_NO_DOMAIN }}
        run: |
          export PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          export PAGES_ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          bun run --cwd website build

  # What a release ships, made from this commit with no release cut: the Worker built twice as the release run builds it,
  # the two compared byte for byte, and the three files named as the website's build names a release.
  # The one rule left out is the attestation, which only a release's own run makes.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the Worker and write its manifest
        run: bun run --cwd packages/providers/cloudflare bundle "$RUNNER_TEMP/bundle/first"
      - name: Build it again
        run: bun run --cwd packages/providers/cloudflare bundle "$RUNNER_TEMP/bundle/second"
      - name: Refuse built files that a second build of the same commit does not give
        run: diff -r "$RUNNER_TEMP/bundle/first" "$RUNNER_TEMP/bundle/second"
      - name: Name the release from its three files as the website's build does
        run: bun run --cwd packages/providers/cloudflare check-bundle "$RUNNER_TEMP/bundle/first"

  # The dashboard demo as a visitor meets it: built as static files, served under a path of a static host, and walked
  # in a real browser, each engine in parts side by side. Each job builds the demo itself: that takes a second. The test
  # that stops the demo's worker runs in Chromium alone, as the walk's own config sets. The WebKit here is Playwright's
  # build of the engine for Linux, not Safari itself.
  #
  # The job runs inside Playwright's own image, which holds the three browsers and the system libraries they need, so
  # no step asks apt for a package. The image's tag is the Playwright version the lockfile installs: in the image
  # of a version with other browser builds, a test fails at its start and names the image to take.
  demo:
    name: demo / ${{ matrix.engine }} (${{ matrix.part.k }} of ${{ matrix.part.of }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    env:
      # Firefox starts as root only under root's own home folder, and a job in a container has another.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        # The one place that sets how many parts an engine's walk runs in: part k of the same total, once each. Playwright
        # deals the tests out itself. The count follows the slowest other job of this file: enough parts to end before it.
        part: [{ k: 1, of: 3 }, { k: 2, of: 3 }, { k: 3, of: 3 }]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The setup action unpacks bun with unzip, which the image leaves out, and apt would have to fetch it: the
      # image's own npm installs the same bun.
      - name: Install the bun that .bun-version pins
        run: npm install --global "bun@$(cat .bun-version)"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Walk the demo
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.part.k }}/${{ matrix.part.of }}
        run: bun run --cwd packages/demo test:browser --project "$ENGINE" --shard "$SHARD"
      - name: Keep the traces and screenshots of the tests that failed
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-walk-${{ matrix.engine }}-${{ matrix.part.k }}-of-${{ matrix.part.of }}
          path: packages/demo/.cache/walk/
          # The folder's name starts with a dot, and hidden paths are left out unless asked for.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

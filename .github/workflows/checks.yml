# Runs this repository's own checks under the all-green gate.
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync, so edit freely.
#
# The caller passes the repository's secrets through (a job reading an environment secret declares its environment) and
# caps at contents: read. A check needing more permissions gets its own workflow, wired via .github/settings.yml.
#
# A job skipped by its own `if:` stands down from the all-green gate. A job with `continue-on-error: true` is an
# advisory check, whose failures stay out of the gate too.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint (biome)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Test the Worker (Workers runtime)
        run: bun run test:worker

  # The product's tests on every OS a user publishes from. The runtime is the bun that .bun-version pins: the tests
  # import bun:test, which no other runtime provides. The release pipeline's tests run in `check` alone: that pipeline
  # runs on ubuntu and nowhere else. The Worker's tests run in `check` alone too: they need the Workers runtime, and the
  # root `test` script this job calls leaves `packages/worker` out.
  matrix:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test the packages
        run: bun run test ./packages/ ./tests/layout.test.ts

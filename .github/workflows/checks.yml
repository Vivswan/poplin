# Runs this repository's own checks under the all-green gate.
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync, so edit freely.
#
# The caller passes the repository's secrets through (a job reading an environment secret declares its environment) and
# caps at contents: read. A check needing more permissions gets its own workflow, wired via .github/settings.yml.
#
# A job skipped by its own `if:` stands down from the all-green gate. A job with `continue-on-error: true` is an
# advisory check, whose failures stay out of the gate too.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint (biome)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Test the Worker (Workers runtime)
        run: bun run test:worker

  # The product's tests on every OS a user publishes from. The runtime is the bun that .bun-version pins: the tests
  # import bun:test, which no other runtime provides. The release pipeline's tests run in `check` alone: that pipeline
  # runs on ubuntu and nowhere else. The Worker's tests run in `check` alone too: they need the Workers runtime, and the
  # root `test` script this job calls leaves `packages/worker` out.
  matrix:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test the packages
        run: bun run test ./packages/ ./tests/layout.test.ts

  # The OpenTofu module: formatted, valid against the provider's schema, and its plan logic tested with a mocked provider,
  # so no Cloudflare credentials are read.
  tofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
      - name: Format
        run: tofu fmt -check -recursive tofu
      - name: Init
        run: tofu -chdir=tofu init -backend=false -input=false
      - name: Validate
        run: tofu -chdir=tofu validate
      - name: Test
        run: tofu -chdir=tofu test

  # The published package as a user gets it: packed, installed from the tarball with npm, and run under plain Node.
  # bun installs the workspace; the Node of the matrix runs the bundler, npm, and the installed package.
  package:
    name: package / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Pack, install, and run the package
        run: bun run --cwd packages/cli smoke

  # The website: its TypeScript checked, and every page built under the address the Pages deploy serves it from. The
  # build is what proves the pages render; the environment is the one .github/actions/site-build sets.
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bunx tsc -p website
      - name: Build
        run: |
          export PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          export PAGES_ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          bun run --cwd website build

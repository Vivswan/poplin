# Runs this repository's own checks under the all-green gate.
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync, so edit freely.
#
# The caller passes the repository's secrets through (a job reading an environment secret declares its environment) and
# caps at contents: read. A check needing more permissions gets its own workflow, wired via .github/settings.yml.
#
# A job skipped by its own `if:` stands down from the all-green gate. A job with `continue-on-error: true` is an
# advisory check, whose failures stay out of the gate too.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The upgrade tests read the last release from the tags, and its code and one older commit from the history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint (biome)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Test the dashboard's client
        run: bun run test:client
      - name: Build the Worker bundle and test the Worker (Workers runtime)
        run: bun run test:worker

  # The product's tests and the three tree guards on every OS a user publishes from. The runtime is the bun that
  # .bun-version pins: the tests import bun:test, which no other runtime provides. The fuzz tests run in `check` alone.
  # The Worker's tests run in `check` alone too: they need the Workers runtime, and the root `test` script this job
  # calls leaves the Workers-runtime tests of `packages/cloudflare` out.
  matrix:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test the packages and the tree guards
        run: bun run test ./packages/ ./tests/layout.test.ts ./tests/portable.test.ts ./tests/no-old-shapes.test.ts

  # The OpenTofu module: formatted, valid against the provider's schema, and its plan logic tested with a mocked provider,
  # so no Cloudflare credentials are read.
  tofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
      - name: Format
        run: tofu fmt -check -recursive packages/cloudflare/tofu
      - name: Init
        run: tofu -chdir=packages/cloudflare/tofu init -backend=false -input=false
      - name: Validate
        run: tofu -chdir=packages/cloudflare/tofu validate
      - name: Test
        run: tofu -chdir=packages/cloudflare/tofu test

  # Every link, heading anchor, and image of the repository's Markdown pages, as lychee.toml sets the check. No install:
  # the pages link nothing a build makes. The lychee is the one the site's own link check runs.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the links and images of every Markdown page
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: "'**/*.md'"
          # The check is offline, so the action gets no token to send.
          token: ""

  # The published package as a user gets it: packed, installed from the tarball with npm, and run under plain Node.
  # bun installs the workspace; the Node of the matrix runs the bundler, npm, and the installed package.
  package:
    name: package / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Pack, install, and run the package
        run: bun run --cwd packages/cli smoke

  # The website: its TypeScript checked, and every page built under the address the Pages deploy serves it from. The
  # build is what proves the pages render; the environment is the one .github/actions/site-build sets.
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bunx tsc -p website
      - name: Build
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          export PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          export PAGES_ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          bun run --cwd website build

  # The dashboard demo as a visitor meets it: built as static files, served under a path of a static host, and walked
  # in a real browser, one job per engine. Each job builds the demo itself: the build takes about a second. The test
  # that stops the demo's worker runs in Chromium alone, as the walk's own config sets. The WebKit here is Playwright's
  # build of the engine for Linux, not Safari itself.
  demo:
    name: demo / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read the Playwright version the lockfile installed
        id: playwright
        working-directory: packages/demo
        run: echo "version=$(bunx playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Keep the engine's browser between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ steps.playwright.outputs.version }}
      # With the browser already kept, this installs the system libraries it needs and downloads no browser.
      - name: Install the browser
        working-directory: packages/demo
        env:
          ENGINE: ${{ matrix.engine }}
        run: bunx playwright install --with-deps "$ENGINE"
      - name: Walk the demo
        env:
          ENGINE: ${{ matrix.engine }}
        run: bun run --cwd packages/demo test:browser --project "$ENGINE"
      - name: Keep the traces and screenshots of the tests that failed
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-walk-${{ matrix.engine }}
          path: packages/demo/.cache/walk/
          # The folder's name starts with a dot, and hidden paths are left out unless asked for.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

# Measures what each action costs the database and the storage, on every pull request and every push to main.
#
#   every run                 the tables in the job's summary, and the `action-costs` artifact: every row as JSON
#   a pull request            one comment, kept current: the rows that changed against the newest green run on main
#   a pull request of a fork  the summary and the artifact alone: its token writes no comment
#
# The numbers come from packages/providers/cloudflare/tests/worker/request-budget.test.ts, which fails the job when a row is over
# its budget. The comment is written all the same, so it shows the row that went over.
#
# This file is repo-owned. It is a workflow of its own because the comment needs pull-requests: write, which
# checks.yml is capped below; the one job that comments holds that permission, and runs for a pull request alone.

name: Action Costs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: action-costs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  costs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The artifact of the newest run on main is read through the API.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Measure what each action costs
        env:
          ACTION_COSTS_FILE: ${{ runner.temp }}/action-costs.json
        run: bun run --cwd packages/providers/cloudflare costs
      - name: Keep the costs of this run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-costs
          path: ${{ runner.temp }}/action-costs.json
          if-no-files-found: error
      - name: Compare with the newest run on main
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_COSTS_FILE: ${{ runner.temp }}/action-costs.json
          COMMENT_FILE: ${{ runner.temp }}/action-costs.md
        run: bun run --cwd packages/providers/cloudflare costs:compare
      - name: Hand the comment to the job that writes it
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-costs-comment
          path: ${{ runner.temp }}/action-costs.md
          if-no-files-found: error

  # The comment of a pull request from this repository. A fork's pull request has no such job: its token cannot write.
  comment:
    needs: costs
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-costs-comment
          path: ${{ runner.temp }}
      - name: Keep one comment on the pull request
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: poplin/action-costs
          path: ${{ runner.temp }}/action-costs.md

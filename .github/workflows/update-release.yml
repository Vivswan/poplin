# Prepare the draft release here: packaging, asset uploads, and note edits.
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync.
#
# Publishing waits for every job, and every asset uploaded here is attested at publish time.

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag (forced at creation, so it is checkout-able before publication)
        required: true
        type: string

jobs:
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # also what makes the draft visible to gh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        # Repository-specific release preparation goes here, e.g.:
        #   ./build.sh
        #   gh release upload "$RELEASE_TAG" ./artifact --clobber
        run: echo "nothing to add to $RELEASE_TAG yet"

  # Whether the owner has turned npm publishing on.
  npm-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        env:
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "$NPM_PUBLISH" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::npm publishing is off, so $RELEASE_TAG was not published to npm: the repository variable NPM_PUBLISH is not \"true\"."
          fi

  # Publishes the release to npm under the `latest` dist-tag, through trusted publishing: no npm token.
  publish-npm:
    needs: [npm-ready]
    if: needs.npm-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Node 24 carries an npm new enough for trusted publishing; the floor step holds it to that.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the npm floor
        run: bun .github/scripts/release-pipeline.ts npm-floor
      # npm builds the package before it packs it (the package's prepack script).
      - name: Publish under latest
        env:
          TAG: ${{ inputs.tag }}
        run: bun .github/scripts/release-pipeline.ts npm-publish stable

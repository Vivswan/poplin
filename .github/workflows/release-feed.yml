# Builds the website again once a release is out, so that `releases.json` and `latest.json` name it.
#
# This file is repo-owned.
#
# The run of main that cuts a release deploys the website while the release is still a draft, and a draft's files are
# not public: that deploy names no new release. An install reads the website to learn which release to take.
#
#   every green run of CI for a push to main ends -> does the website name the version that commit's files say?
#     it does, or no release of that version is out   -> nothing
#     the release is out and the website lacks it     -> the fleet's Pages deploy, of that same commit
#     the website gives no file that can be read      -> the job fails, and nothing is deployed
#
# The run that cuts the release ends after it published it, so this follows within minutes, with no step by hand. A
# later commit of main says the same version until the next release, so each later green run asks again.

name: Release Feed

on:
  # Only a green run for a push to main of this repository is acted on (the first job's `if`): its commit passed the
  # gate, and no pull request's code or text is read.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One run at a time, the reading and the deploy together: a reading made while another run's deploy was at work would
# build an older commit over a newer one, and take that one's release off the website.
concurrency:
  group: release-feed
  cancel-in-progress: false

jobs:
  behind:
    name: is the website behind the release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      behind: ${{ steps.feed.outputs.behind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read whether the website lacks a release that is out
        id: feed
        run: bun packages/providers/cloudflare/scripts/feed-behind.ts

  # The same deploy the managed ci.yml's `site` leg calls, in the same lane. It waits for a deploy at work, and a newer
  # commit's deploy takes its place: that one names the release too.
  site:
    needs: [behind]
    if: needs.behind.outputs.behind == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    uses: Vivswan/repo-platform/.github/workflows/reusable-site.yml@stable
    with:
      sha: ${{ github.event.workflow_run.head_sha }}

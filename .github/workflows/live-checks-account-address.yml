# Checks the real install on the Cloudflare test account that holds no domain: an install on the account's free address, at midnight UTC and on a manual run.
# Puts it back to the sample sites after each run of the checks, and at midnight UTC. live-checks.yml does the same for the account that holds a domain.
#
#   midnight UTC, or a run by hand -> the steps of live-install.yml on the `without-domain-ci-tests` account, for main as it is
#   after those steps, always      -> the install put at the newest green commit of main, with the samples and the demo: after checks that failed or were cancelled too
#   a push to main                 -> GitHub starts no run here: post-green.yml puts the install at each green commit
#   a midnight run that ended red, by its checks or its put-back -> one open issue for this kind of install, which the next green midnight run closes
#
# The steps and the reset are in live-install.yml, written once for both kinds. release-gate.yml runs the same steps on the pull request of a release.

name: Live Checks (account address)

on:
  # Midnight UTC. A schedule runs the default branch's own file and nothing a pull request or a fork wrote; a fork's
  # schedule has none of this repository's secrets.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      many_files:
        description: Also publish two thousand small files (thousands of requests on the test account)
        type: boolean
        default: false
      start_over:
        description: First remove the test install with poplin uninstall, then make it from nothing with poplin install
        type: boolean
        default: false
      upgrade:
        description: First upgrade from the last release, then from the newest earlier pre-release as advice (each removes the test install and writes about 230 database rows)
        type: boolean
        default: false
      load:
        description: Also run the small load after the checks (at most 600 rows written and 80 bucket writes and lists on the test account)
        type: boolean
        default: false

permissions:
  contents: read

# One waiting run of this workflow for each event: a newer run by hand takes the place of an older one that waits, and never of the midnight run.
concurrency:
  group: live-checks-account-address-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Only a run by hand with the box ticked. release-gate.yml calls the same file, for the pull request of a release.
  # From the last release first: its failure fails the run.
  upgrade:
    name: live (account address)
    if: inputs.upgrade == true
    uses: ./.github/workflows/live-upgrade.yml
    with:
      kind: account address
      from: release
      environment: without-domain-ci-tests
    # Only the names the steps read. The called job names the environment, and its secret of a name is the one it reads, not a value handed over here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # Then from the newest pre-release that is an earlier build, in the same lane: its failure is a warning.
  upgrade-next:
    name: live (account address)
    needs: [upgrade]
    if: ${{ !cancelled() && inputs.upgrade == true }}
    uses: ./.github/workflows/live-upgrade.yml
    with:
      kind: account address
      from: next
      environment: without-domain-ci-tests
    # Only the names the steps read. The called job names the environment, and its secret of a name is the one it reads, not a value handed over here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # After the upgrades where they were asked for, whatever they came to.
  live:
    name: live (account address)
    needs: [upgrade, upgrade-next]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/live-install.yml
    with:
      kind: account address
      environment: without-domain-ci-tests
      many_files: ${{ inputs.many_files == true }}
      start_over: ${{ inputs.start_over == true }}
      load: ${{ inputs.load == true }}
    # Only the names the steps read. The called jobs name the environment, and its secret of a name is the one they read, not a value handed over here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # Whatever the checks came to, and after a run that was cancelled: no check that was cut short leaves the install, or the demo, as it stopped.
  put-back:
    name: put back (account address)
    needs: [live]
    if: always()
    uses: ./.github/workflows/live-install.yml
    with:
      kind: account address
      environment: without-domain-ci-tests
      put_back_only: true
    # Only the names the steps read. The called jobs name the environment, and its secret of a name is the one they read, not a value handed over here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POPLIN_LIVE_LOGIN: ${{ secrets.POPLIN_LIVE_LOGIN }}

  # A red midnight run is one open issue of this kind's label, refreshed each red night; a green one closes it. A run by hand files and closes nothing.
  # A cancelled run counts as red: a job that reached its timeout is cancelled, not failed. A put-back that failed is a red night too.
  report:
    name: report (account address)
    needs: [live, put-back]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action writes the issue, and assigns it itself: an issue it creates starts no workflow.
    permissions:
      issues: write
    steps:
      - name: File or refresh the issue of a red night
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "live-nightly-account-address"
          title: Nightly live checks failed (account address)
          label-color: "D93F0B"
          label-description: "The nightly live checks of the test install (account address) ended red"
          stream: generic

      - name: Close the issue on a green night
        if: needs.live.result == 'success' && needs.put-back.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "live-nightly-account-address"
          stream: generic

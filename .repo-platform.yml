modules: [bun, release-please, npm, pr-title, site, nightly, fuzzer, autofix]
project:
  name: Poplin
  slug: poplin
  description: "Agents publish static sites to your own Cloudflare account: private by default, shareable by secret link, or public."
npm:
  path: packages/cli
site:
  vars: [DEMO_URL]
# What a fix-lint label may commit back (the platform's docs/modules/autofix.md); the hook is .github/actions/autofix.
autofix:
  # Every kind of file biome reads: the hook runs `bun run lint:fix`, which changes no other.
  label:
    paths: ["**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,astro,css,html,svg,json,jsonc,md,yml,yaml}"]
